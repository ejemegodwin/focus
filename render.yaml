services:
  - type: web
    name: focus
    runtime: python
    buildCommand: npm ci && npm run build
    startCommand: python3 backend/server.py
    healthCheckPath: /ready
    envVars:
      - key: FOCUS_DB_PATH
        value: /var/data/focus.db
    disk:
      name: focus-data
      mountPath: /var/data
      sizeGB: 1
