services:
  - type: web
    name: focus
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    envVars:
      - key: FOCUS_DB_PATH
        value: /var/data/focus.db
      - key: FOCUS_ADMIN_EMAILS
        sync: false
      - key: FOCUS_ALLOWED_ORIGIN
        value: https://focus.com
    disk:
      name: focus-data
      mountPath: /var/data
      sizeGB: 1
